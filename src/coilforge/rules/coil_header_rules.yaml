  # Distributor extension note (DX only). Orientation branches on product line exactly
  # like R-031 (DOWN) / R-032 (UP): Ventum+ mounts the distributor ConnectionUP, every
  # other DX line mounts down. The 6" length is R-033 (dist_extension). Mutually
  # exclusive rules over the ProductFamily enum -> exactly one note per DX, never two.
  # R-035c carries the hot-gas-bypass wording and DISPLACES R-035b (which is gated
  # not_hot_gas_bypass) rather than adding to it -- hence the mutual exclusion holds.
  - rule_id: R-035a
