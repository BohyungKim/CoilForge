  # R-012/R-013/R-014: TF/BF conflicts resolved in favor of the checklist
  # values (John, 2026-06-11: "checklist is typically the most accurate").
  # The Terra asymmetry (TF=1.625, BF) is intentional per the checklist.
  # terra_variant: null = "Terra defaults to Terra H C" (engine has no variant gate
  # for null); John 2026-06-25 set the Terra H C bottom flange to 0.5. Terra V keeps
  # the old 0.375 via the R-012v exception below (last-writer-wins by file order).
  - rule_id: R-012
    applies_to: { coil_type: [DX, HGRH], product_family: [TERRA], terra_variant: null, size_pattern: null }
    field: [top_flange, bottom_flange]
    field_values: { top_flange: 1.625, bottom_flange: 0.5 }
    kind: constant
    confidence: HIGH
    review_required: false
    blocked_reason: null
    evidence_refs: ["CHK TERRA TF=1.625", "John 2026-06-25: Terra H C BF=0.5 (was 0.375)"]

  # R-012v: Terra V keeps BF=0.375. Must follow R-012 — the generic emitter writes
  # bottom_flange last-writer-wins in file order, so for a Terra V request R-012
  # sets 0.5 and this overwrites it back to 0.375. TF stays 1.625 (from R-012).
  - rule_id: R-012v
