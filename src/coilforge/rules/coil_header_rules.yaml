    blocked_reason: null
    evidence_refs: ["John 2026-06-30: Terra V TF=BF=0.625 (corrected from TF=1.625/BF=0.375; supersedes CHK TERRA BF=0.375)"]

  # R-014h: HWC Terra flanges depend on INSTALLED ON DP (2026-09-22 template, HWC!C28:C29):
  # on the shared drain pan the coil takes the Terra flanges (R-014 / R-014v); off the pan
  # both flanges are 1. DATA-ONLY — handled by the engine's `_emit_hwc_terra_flanges`
  # helper (listed in _SPECIAL_IDS), NOT the generic `only_when`, because the input is
  # tri-state: an UNKNOWN pan state must keep the Terra values (HIGH, so slot.TF/BF/CH
  # keep resolving) and only flag review; a bool() gate would read None as "off the pan"
  # and rewrite every Terra H HWC to 1/1. CWC (C24:C25) has no such branch.
  - rule_id: R-014h
    applies_to: { coil_type: [HWC], product_family: [TERRA], terra_variant: null, size_pattern: null }
    field: [top_flange, bottom_flange]
    value: null
    field_values_off_pan: { top_flange: 1, bottom_flange: 1 }
    kind: special_hwc_dp_flanges
    requires_inputs: [installed_on_drain_pan]
    confidence: HIGH
    review_required: false
    blocked_reason: null
    evidence_refs: ["CHK HWC!C28:C29 (2026-09-22): IF(C20=TRUE, <Terra TF/BF>, 1)", "John 2026-09-22: checklist wins"]

