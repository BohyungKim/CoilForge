  # value_map: the generic emitter's value_map has no default and keys on the COARSE
  # family (Terra V is folded to TERRA before lookup), so last-writer-wins by file order is
  # the only form that expresses "Terra V and Ventum+-class 1.875, everyone else 2.25".
  - rule_id: R-006
