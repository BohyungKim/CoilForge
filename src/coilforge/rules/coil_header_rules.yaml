  #   DX!C64/C65, HGRH!C68/C69, HWC!C36/C37, CWC!C32/C33.
  # Judgement per direction: available = casing_dim/(2 if h_half) - <sub>, and the
  # coil fits when available >= the basis value (FL/OAL for width, FH/CH for
  # height). Key is "<coil_type>|<class>"; <class> = the R-075 NOVA size_class for
  # NOVA, else the product_family. DX/HGRH w_sub bakes in the -8 header/distributor
  # allowance. VENTUM_PLUS uses casing_height/2 (stacked construction). Single
  # source (CHK only) -> every fit verdict is review-required (MEDIUM at best).
