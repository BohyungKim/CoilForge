# CoilForge — deterministic header prepopulation rule table.
#
# One entry per Rule ID from docs/rules/coil_header_rule_extraction.md.
# This file is the ONLY source of rules; no rule may exist here without a
# Rule ID and non-empty evidence_refs (enforced by the schema-validation test).
#
# Entry schema
#   rule_id          : "R-###" (unique)
#   applies_to       : { coil_type, product_family, terra_variant, size_pattern }
#                      "*" (or ["*"]) means "all"; null means "not constrained".
#   field            : output field name, or a list of field names.
#   value            : literal value (XOR formula). null for CONFLICT/LOW.
#   value_map        : product_family -> value (used instead of `value`).
#   formula          : human-readable formula string (evaluated in engine by `kind`).
#   kind             : engine handler hint (constant | formula_* | notes_* | lookup |
#                      validation | noop | special_*).
#   only_when        : conditional trigger (feeds_eq_1 | feeds_gt_1 | coating_set |
#                      hot_gas_bypass | with_hgrh | back_to_back | qty_valves_set).
#   requires_inputs  : inputs that must be present for a formula rule to evaluate.
#   confidence       : HIGH | MEDIUM | LOW | CONFLICT
#   review_required  : bool
#   blocked_reason   : reason string for CONFLICT/LOW (cites both evidence refs).
#   evidence_refs    : verbatim citations from the extraction doc.

schema_version: "header-prepopulate.v1"

