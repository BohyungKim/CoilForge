      "HWC|NOVA_2IN":     { w_sub: 4,    w_basis: OAL, h_sub: 4,     h_basis: CH, h_half: false }
      "HWC|VENTUM_H":     { w_sub: 2.5,  w_basis: OAL, h_sub: 2.5,   h_basis: CH, h_half: false }
      "HWC|TERRA":        { w_sub: 4,    w_basis: OAL, h_sub: 3.875, h_basis: CH, h_half: false }
      "HWC|VENTUM_PLUS":  { w_sub: 6.5,  w_basis: OAL, h_sub: 8.25,  h_basis: CH, h_half: true }
      "CWC|NOVA_1IN":     { w_sub: 2.5,  w_basis: OAL, h_sub: 5,     h_basis: CH, h_half: false }
      "CWC|NOVA_2IN":     { w_sub: 4,    w_basis: OAL, h_sub: 6,     h_basis: CH, h_half: false }
      "CWC|VENTUM_H":     { w_sub: 2.5,  w_basis: OAL, h_sub: 5,     h_basis: CH, h_half: false }
      "CWC|TERRA":        { w_sub: 4,    w_basis: OAL, h_sub: 3.875, h_basis: CH, h_half: false }
      "CWC|VENTUM_PLUS":  { w_sub: 6.5,  w_basis: OAL, h_sub: 8.25,  h_basis: CH, h_half: true }
      # Terra V (2026-09-22 template). WIDTH FIT is `(casing_width - OAL) >= 9.75` on the
      # DX/HGRH sheets (C64 / C68) and `>= 8.75` on the water sheets (HWC!C41 / CWC!C37) —
      # basis OAL on every category (the sheet reads column D SELECTION OAL; CoilForge
      # mirrors with its own OAL, as it already does for the other lines). HEIGHT FIT does
      # NOT use the casing height at all: it is a finned-height cap per unit-size band
      # (`h_kind: fh_max_by_size`, table below; the same on all four sheets).
      "DX|TERRA_V":      { w_sub: 9.75, w_basis: OAL, h_kind: fh_max_by_size, h_basis: FH }
      "HGRH|TERRA_V":    { w_sub: 9.75, w_basis: OAL, h_kind: fh_max_by_size, h_basis: FH }
      "HWC|TERRA_V":     { w_sub: 8.75, w_basis: OAL, h_kind: fh_max_by_size, h_basis: FH }
      "CWC|TERRA_V":     { w_sub: 8.75, w_basis: OAL, h_kind: fh_max_by_size, h_basis: FH }
    # Terra V HEIGHT FIT: FH must not exceed the cap for the unit size (CHK *!HEIGHT FIT
    # Terra V arm: sizes 6-24 -> 24, 32-48 -> 42, 60-84 -> 45, 100 -> 48).
    fh_max_by_size:
      "006": 24
      "009": 24
      "012": 24
      "015": 24
      "018": 24
      "024": 24
      "032": 42
      "040": 42
      "048": 42
      "060": 45
      "072": 45
      "084": 45
      "100": 48

  # --- 2.7 Notes / special-case conflicts ------------------------------------
  # R-080/R-081: the coating note fires ONLY when a custom coating is actually
  # required (John, 2026-07-15) -- a "do not coat the last 5-6 inches" instruction is
  # meaningless on a coil nobody is coating. `only_when: coating_set` = coating is
  # stated and is not NONE; every non-NONE value in the checklist vocabulary
  # (FINKOTE*/HERESITE*/ELECTROFIN*/BLYGOLD*/BLACK POLY) is a custom coating, so
  # "set" and "custom" coincide. Coating UNKNOWN -> no note (fail-closed; never
  # invent a coating process the source did not state).
  # SUPERSEDES John 2026-06-11 ("Direct Coil has no coating trigger field, so the
  # note is always appended") -- the trigger now flows from the submittal's
  # `manufacturing_options.coil_coating` via _engine_drawing_notes.
  # SOP Rev H wording wins (authored by John Kim) -> conflict resolved -> HIGH.
  # CHK still carries the older wording and should be updated to match.
  # NOTE: coating notes apply to DX and HGRH only. CWC/HWC intentionally have
  # no coating note -- those coils typically have no coating process
  # (confirmed by John, 2026-06-11).
  - rule_id: R-080
    applies_to: { coil_type: [DX], product_family: ["*"], terra_variant: null, size_pattern: null }
    field: notes
    value: "Do Not Coat Last 5-6 inches of Distributor Extensions."
    kind: notes_append
    only_when: coating_set
    requires_inputs: [coating]
    confidence: HIGH
    review_required: false
    blocked_reason: null
    evidence_refs: ["SOP Rev H (authored by John Kim, Dec 2025)", "John direction 2026-06-11", "CHK DX!C23 (older wording, to update)"]

  - rule_id: R-081
