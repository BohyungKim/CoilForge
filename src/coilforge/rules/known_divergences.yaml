  # KD-005 (+ KD-022/023) — Terra V HGRH return I/O rows where the sheet and CoilForge
  # still disagree after the 2026-09-22 template refresh.
  #
  # Traced 2026-08-04 (plan rev.3 Phase B/D4); re-read against the 2026-09-22 template.
  # The refreshed sheet gained Terra V arms for O2 (2.75), TF/BF, SL2 (12) and the FIT
  # rows — KD-004 (O2) is therefore RETIRED (the sheet now agrees). The new O4/O6/O8 arms
  # give 2 where O2 gives 2.75, which John ruled a sheet defect on 2026-09-22 (KD-005,
  # KD-022, KD-023; RP-003). The I3 disagreement that was ours (CoilForge asserted 2.75 on
  # Supply 2+) was FIXED in commit 9abe5a7 and is deliberately NOT registered: a defect we
  # repaired is not a known gap, and leaving it here would suppress a real regression.
  #
  # Structural, hence no delta_band. Scope is `*` (every Terra V size) BY DECLARATION.
  #
  # KD-001 (CD), KD-002/003 (S1/S3) and KD-028/029 (SL1/SL3) RETIRED 2026-09-23. John:
  # "Terra V HGRH CD is always taken from the Coil Checklist". HGRH!C27 still has no
  # Terra V arm, so the sheet computes Terra V through the NOVA / VENTUM H else-branch
  # `MAX(rows base, (n+1)*D + (n-1)*1.5)`, and `_hgrh_cd_multi` now does the same (it used
  # to exclude Terra V and keep the rows base, on the measured RHHGRC-3 reference that
  # prints 3.75 where the sheet gives 4.125). S1/S3 (= CD - ((n+2)*D + (n-1)*1.5)) and
  # SL1/SL3 (= 6 + D/2 - S) only ever differed through that CD, so all five rows match.
  # RP-001's CD arm is moot for CoilForge; the sheet remains Oxygen8's to change.
  # KD-004 (slot.O2) RETIRED 2026-09-22: HGRH!C37 now has a Terra V arm (2.75) that
  # agrees with R-042v, so the row matches and there is nothing to rule on.

  - id: KD-005
    coil_category: HGRH
    product_family: TERRA_V
    terra_variant: TERRA_V
    unit_size_scope: "*"
    slot: slot.O4
    verdict: checklist_wrong
    reason: >-
      Second return-header I/O. The 2026-09-22 template gives HGRH!C38 `IF(C16>1, IF(TERRA
      H, 3.25, 2), "N/A")` — 2 for Terra V — while its own C37 (O2) gives Terra V 2.75.
      A return I/O that differs between header 1 and header 2 of the same coil has no
      engineering basis; John ruled 2026-09-22 that this is a sheet defect (the Terra V
      arm was added to C37 only) and CoilForge keeps 2.75 (R-042v) on every return header.
      Registered per O position rather than as a wildcard: the header index is
      semantically meaningful, so a ruling spanning every O position would silence
      positions nobody has looked at.
    evidence_refs:
      - "CHK:HGRH!C37 (2026-09-22) Terra V O2 = 2.75"
      - "CHK:HGRH!C38:C40 (2026-09-22) Terra V O4/O6/O8 = 2"
      - "RULE:R-042v"
      - "JOHN:2026-09-22 O4+ = 2 is a sheet bug; keep 2.75"
    adjudicated_by: John
    adjudicated_utc: "2026-09-22"
    status: proposed
    rule_proposal: RP-003

