  # ---------------------------------------------------------------------------
  # KD-024..027 (water return O on the Terra lines) RETIRED 2026-09-23 (John).
  # The sheet's Terra O row (CH - 3.25 / CH - 2.75; on HWC only on the drain pan) and
  # the drawn O measured the SAME stubout position from opposite ends. The difference
  # was datum, not value: checklist/compare.py now re-expresses both sides from the
  # header end before matching (`_with_water_o_datum` / `_from_header_end`), and the
  # Terra CWC artwork -- whose own O dimension line is opposite-datum (seed 16.50 =
  # CH 19.25 - I 2.75) -- now prints CH - I (`catalog.TEMPLATE_O_DATUM`). The rows
  # match, so there is nothing left to rule on.
  # ---------------------------------------------------------------------------
